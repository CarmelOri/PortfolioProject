<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin CRM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a7aeb3;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            background-size: cover;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: 90%;
            max-width: 1200px;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            word-wrap: break-word;
        }

        th {
            background-color: #3d4480;
            color: white;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .deleteButton {
            color: white;
            background-color: rgb(112, 107, 164);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .deleteButton:hover {
            background-color: rgb(44, 44, 67);
        }

        @media (max-width: 768px) {
            table {
                width: 100%;
                font-size: 14px;
            }

            th,
            td {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            table {
                width: 100%;
                font-size: 12px;
            }

            th,
            td {
                padding: 6px;
            }

            thead {
                display: none;
            }

            tr {
                display: block;
                margin-bottom: 10px;
            }

            td {
                display: block;
                text-align: right;
                position: relative;
                padding-left: 50%;
                border: none;
                border-bottom: 1px solid #ddd;
            }

            td::before {
                content: attr(data-label);
                position: absolute;
                left: 0;
                width: 50%;
                padding-left: 10px;
                font-weight: bold;
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <h1>Admin CRM - User Management</h1>
    <table id="usersTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Last Logged</th>
                <th>Is Admin</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableDataBody">
            <!-- User rows will be inserted here dynamically -->
        </tbody>
    </table>

    <script>
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let dataForTable = "";
        users.forEach((user, index) => {
            dataForTable += `
            <tr>
                <td data-label="Name">${user.name}</td>
                <td data-label="Username">${user.username}</td>
                <td data-label="Email">${user.email}</td>
                <td data-label="Last Logged">${user.lastLogged}</td>
                <td data-label="Is Admin">${user.isAdmin}</td>
                <td data-label="Action">
                    <button class="deleteButton" onclick="deleteUser(${index})">DELETE</button>
                </td>
            </tr>
        `;
        });
        let tableBody = document.getElementById("tableDataBody");
        tableBody.innerHTML = dataForTable;

        function deleteUser(index) {
            if (confirm("Are you sure you want to delete this user?")) {
                users.splice(index, 1);
                localStorage.setItem("users", JSON.stringify(users));
                location.reload();
            }
        }
    </script>
</body>

</html>
